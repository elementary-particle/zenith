name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path riichi/Cargo.toml -- --check
      - run: cargo clippy --workspace --manifest-path riichi/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace --manifest-path riichi/Cargo.toml --all-targets

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt
      - run: maturin develop --manifest-path riichi/Cargo.toml
      - run: python -m pytest riichi/tests/python -q

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path riichi/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  training-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt -r training/requirements-cpu.lock
      - run: maturin develop --manifest-path riichi/Cargo.toml
      - run: python -m pip install -e training
      - run: python -m pytest training/tests/unit training/tests/contract -q

  training-cuda:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt -r training/requirements-cuda.lock
      - run: maturin develop --release --manifest-path riichi/Cargo.toml
      - run: python -m pip install -e training
      - run: python -m pytest training/tests/integration training/tests/reproducibility -m cuda -q
