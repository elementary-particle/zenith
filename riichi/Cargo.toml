[package]
name = "riichi"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Deterministic multithreaded riichi mahjong environment"
autotests = false

[workspace]
members = ["core"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "riichi"
crate-type = ["cdylib", "rlib"]

[dependencies]
riichi-core = { path = "core" }
numpy = "0.27.1"
pyo3 = { version = "0.27.0", features = ["extension-module"] }
rayon = "1.12.0"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.7"
proptest = "1.7"
serde_json = "1.0"

[[bench]]
name = "interface_migration"
harness = false

[[test]]
name = "core_boundary"
path = "tests/core_boundary.rs"

[[test]]
name = "contract_schema"
path = "tests/contract_schema.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
