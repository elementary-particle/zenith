[package]
name = "riichi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "State-only deterministic riichi mahjong rules and transition core"

[dependencies]
rand = { version = "0.9.0", default-features = false, features = ["std"] }
rand_pcg = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.7"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
