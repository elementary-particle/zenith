[run]
output_root = "runs"
profile = "cuda-production"
seed = 1

[env]
rules_profile = "riichilab-mjsoul-yonma-v1"
# One physical rollout covers one logical PPO update. The indexed native
# completion path and materialized logical-batch update were validated at
# 34.1 GiB peak host and 4.91 GiB peak CUDA-reserved memory on RTX 5090.
num_envs = 2048
num_threads = 8
privileged = true

[rollout]
matches_per_update = 2048
max_frames_per_match = 4096
training_mode = "pure_self_play"

[encoding]
context_tokens = 4096
packing_max_waste = 0.10
inference_packing_max_waste = 0.50

[behavior_cloning]
train_archives = ["../../datasets/tenhou-to-mjai/v2.0.0/2024.zip"]
validation_archives = ["../../datasets/tenhou-to-mjai/v2.0.0/2025.zip"]
train_decisions = 0 # Entire 2024 archive.
validation_decisions = 200000
epochs = 1
token_budget = 65536
learning_rate = 0.0001
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 0.00000001
weight_decay = 0.0001
max_grad_norm = 2.0
boundary_rank_learning_rate = 0.0003
boundary_rank_coefficient = 1.0
label_smoothing = 0.02
confidence_penalty_coefficient = 0.0

[model]
layers = 3
d_model = 192
query_heads = 4
kv_heads = 1
head_dim = 48
ffn_dim = 384
action_memory_layers = 4
action_memory_ffn_dim = 384
share_all_action_tiles = true
concealed_shape_channels = 24
concealed_shape_blocks = 2
rank_critic_width = 64

[ppo]
# Every decision receives the predicted final-rank utility change from the
# start of its kyoku to the next kyoku boundary (or exact terminal utility).
ratio_clip = 0.10
# Two retained actor passes move about 2e-4 KL from BC and substantially less
# later in training. Keep the controller centered on that useful early step.
target_kl = 0.0002
kl_coefficient_initial = 0.2
kl_coefficient_minimum = 0.0001
kl_coefficient_maximum = 10.0
kl_adaptation_factor = 1.5
# At batch 2048, a second pass improves the untouched-rollout surrogate at
# both the BC initialization and a late PPO checkpoint. Four passes regress
# late and provide little additional early benefit per unit of compute.
epochs = 2
minibatches = 1
token_budget = 65536
actor_learning_rate = 0.00006
critic_learning_rate = 0.0003
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 0.00001
weight_decay = 0.0001
warmup_fraction = 0.02
boundary_rank_coefficient = 1.0
max_grad_norm = 1.0
# One full-batch boundary-critic gradient is accumulated while rollout chunks
# released. Replaying retained rollouts is intentionally unsupported.
critic_epochs = 1
# The production EMA sweep favored a weak, fast-moving anchor: it keeps mean
# step KL near the proximal target without letting the fixed magnet dominate
# the policy objective late in training. Decay is defined in matches, so
# changing rollout batch size does not change the magnet time scale.
magnet_kl_coefficient = 0.03
magnet_half_life_matches = 8192
# Preserve a minimal within-family exploration floor for support recovery.
entropy_floor = 0.0001

[curriculum]
total_matches = 262144

[population]
retained_checkpoints_max = 64

[evaluation]
cadence_matches = 1024
checkpoint_matches = [16384, 32768, 65536, 131072, 262144]
# Four cyclic seat rotations per seed yield 1,024 arena matches.
held_out_seed_start = 10001
held_out_seed_count = 256
diagnostic_seed_start = 20000
diagnostic_seed_count = 256
seat_rotations = 4
batch_size = 1024
token_budget = 65536

[rating]
mu = 25.0
sigma = 8.333333333333334
beta = 4.166666666666667
kappa = 0.0001
tau = 0.0
ordinal_sigma = 3.0

[checkpoint]
cadence_matches = 4096
keep = 64

[metrics]
progress_every_matches = 128

[metrics.tensorboard]
enabled = true
histogram_every_matches = 12800
histogram_max_elements = 65536
histogram_max_bytes = 4194304
flush_seconds = 30
runtime_failure = "canonical_only_at_safe_boundary"
