schema_version = 2

[run]
name = "zenith-ppo"
output_root = "runs"
profile = "cuda-production"
seed = 1

[env]
state_schema = 2
event_schema = 2
hand_analysis_schema = 2
snapshot_schema = 1
rules_profile = "riichilab-mjsoul-yonma-v1"
rules_profile_id = 2
rng_profile_id = 1
num_envs = 128
num_threads = 8
privileged = true

[rollout]
learner_decisions_per_update = 8192
max_frames_per_call = 4096
context_overflow = "error"
complete_kyoku_per_env = true

[observation]
critic_mode = "privileged"
mask_schema = 1

[encoding]
token_schema = 5
action_schema = 2
context_tokens = 4096
packing_max_waste = 0.10

[model]
schema = 5
layers = 6
critic_layers = 2
d_model = 256
query_heads = 8
kv_heads = 2
head_dim = 32
ffn_dim = 768
dropout = 0.0
norm = "rmsnorm"
position = "rope"

[ppo]
gamma = 1.0
gae_lambda = 0.98
ratio_clip = 0.20
target_kl = 0.02
epochs = 4
token_budget = 65536
learning_rate = 0.0003
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 0.00001
weight_decay = 0.01
warmup_fraction = 0.02
value_loss = "huber"
value_coefficient = 0.5
entropy_start = 0.01
entropy_end = 0.001
max_grad_norm = 0.5
belief_coefficient = 0.10
belief_tenpai_coefficient = 0.25

[curriculum]
schema = 2
total_updates = 10000
discard_only_end = 0.20
discard_kyoku_blend_end = 0.35
kyoku_only_end = 0.60
kyoku_rank_blend_end = 0.75

[population]
sampler = "uniform_without_replacement_v1"
learner_seats = 2
shortage = "all_current_bootstrap"
admit_every_updates = 10
resident_historical_models = 4
resident_bytes = 4294967296
retained_checkpoints_min = 32
retained_checkpoints_max = 64
checkpoint_cohort_size = 2

[evaluation]
cadence_updates = 250
seat_block_games = 4
held_out_seeds = [10001, 10002, 10003, 10004]

[rating]
namespace = "official_plackett_luce_v1"
mu = 25.0
sigma = 8.333333333333334
beta = 4.166666666666667
kappa = 0.0001
tau = 0.0
ordinal_sigma = 3.0

[checkpoint]
cadence_updates = 10
keep = 8

[metrics]
canonical = true
progress_every_updates = 1

[metrics.tensorboard]
enabled = true
scalar_every_updates = 1
histogram_every_updates = 100
histogram_max_elements = 65536
histogram_max_bytes = 4194304
flush_seconds = 30
final_flush_timeout_seconds = 30
runtime_failure = "canonical_only_at_safe_boundary"
