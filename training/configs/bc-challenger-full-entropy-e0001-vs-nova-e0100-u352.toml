extends = "default.toml"

[run]
# Independent low-entropy response seed. This separates local-basin variance
# from the stronger 0.01 full-action entropy intervention.
seed = 352515

[ppo]
# Standard Shannon entropy over every legal action is retained at a negligible
# coefficient: the gradient audit measured about 0.035% of policy-gradient
# norm at the completed direct challenger.
entropy_coefficient = 0.0001

[rollout]
training_mode = "checkpoint_league"
league_checkpoints = [
  "../../runs/ppo-bc2024-nova-continuation-e0100-u128/checkpoints/3218c9f0bedc303274a8cebb66f60478433dcb591c502f06d954a3e22cf20461",
]
league_learner_seats = 1
league_minimum_games = 1
league_uniform_fraction = 1.0

[curriculum]
total_matches = 131072

[evaluation]
checkpoint_matches = [16384, 32768, 65536, 98304, 131072]
held_out_seed_count = 1024

[population]
