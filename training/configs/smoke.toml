extends = "default.toml"

[run]
profile = "cpu-smoke"
seed = 7

[env]
num_envs = 1
num_threads = 1

[rollout]
matches_per_update = 1

[encoding]
context_tokens = 1024
packing_max_waste = 0.15

[model]
layers = 1
d_model = 16
query_heads = 2
kv_heads = 1
head_dim = 8
ffn_dim = 48
action_memory_layers = 1
action_memory_ffn_dim = 48
concealed_shape_channels = 4
concealed_shape_blocks = 1
rank_critic_width = 16

[ppo]
target_kl = 0.05
actor_learning_rate = 0.00005
critic_learning_rate = 0.0002
warmup_fraction = 0.0
critic_epochs = 1

[curriculum]
total_matches = 1

[population]
retained_checkpoints_max = 4

[evaluation]
cadence_matches = 1
checkpoint_matches = [1]
held_out_seeds = [101, 102, 103, 104]
diagnostic_seed_start = 1000
diagnostic_seed_count = 4
batch_size = 4

[checkpoint]
cadence_matches = 1
keep = 2

[metrics]
progress_every_matches = 1

[metrics.tensorboard]
histogram_every_matches = 100
flush_seconds = 1
