[run]
name = "curriculum-smoke"
output_root = "runs"
profile = "cpu-smoke"
seed = 17

[env]
rules_profile = "riichilab-mjsoul-yonma-v1"
num_envs = 64
num_threads = 4
privileged = true

[rollout]
matches_per_update = 64
max_frames_per_match = 4096
context_overflow = "error"

[observation]
critic_mode = "privileged"

[encoding]
context_tokens = 1024
packing_max_waste = 0.15

[model]
layers = 1
critic_layers = 1
d_model = 16
query_heads = 2
kv_heads = 1
head_dim = 8
ffn_dim = 48
dropout = 0.0
norm = "rmsnorm"
position = "rope"

[ppo]
gamma = 1.0
score_gae_lambda = 0.98
rank_gae_lambda = 1.0
ratio_clip = 0.20
target_kl = 0.05
epochs = 1
minibatches = 1
token_budget = 16384
learning_rate = 0.0003
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 0.00001
weight_decay = 0.01
warmup_fraction = 0.0
score_value_scale = 10.0
value_clip = 0.0
value_coefficient = 0.5
entropy_start = 0.01
entropy_end = 0.01
max_grad_norm = 0.5
belief_coefficient = 0.10
belief_tenpai_coefficient = 0.25

[curriculum]
total_matches = 576
rank_start_fraction = 0.60
rank_ramp_fraction = 0.15
minimum_discard_rows = 4096
competence_threshold = 0.15
pause_threshold = 0.18
competence_batches = 5
regression_batches = 2
taper_matches = 10000

[teacher]
discard_coefficient = 0.50
reaction_coefficient = 0.15
riichi_coefficient = 0.10
reaction_entropy_coefficient = 0.025
discard_temperature = 1.0
reaction_pass_target = 0.90
reaction_call_target = 0.75
reaction_call_pass_target = 0.25
riichi_target = 0.80
dama_target = 0.20
supported_yaku = ["yakuhai", "open_tanyao"]

[population]
retained_checkpoints_max = 8

[evaluation]
cadence_matches = 192
checkpoint_matches = [192, 384, 576]
held_out_seeds = [201, 202, 203, 204]
diagnostic_seed_start = 2000
diagnostic_seed_count = 64
seat_rotations = 4

[rating]
mu = 25.0
sigma = 8.333333333333334
beta = 4.166666666666667
kappa = 0.0001
tau = 0.0
ordinal_sigma = 3.0

[checkpoint]
cadence_matches = 64
keep = 10

[metrics]
canonical = true
progress_every_matches = 64

[metrics.tensorboard]
enabled = true
scalar_every_matches = 64
histogram_every_matches = 192
histogram_max_elements = 4096
histogram_max_bytes = 1048576
flush_seconds = 1
final_flush_timeout_seconds = 5
runtime_failure = "canonical_only_at_safe_boundary"
