[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-ppo-v1"
version = "0.1.0"
description = "PPO training for RiichiEnv with semantic state tokens and a fixed action space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "ray[default]>=2.9",
  "tensorboard>=2.14",
  "torch>=2.2",
]

[project.scripts]
riichi-ppo-train = "riichi_ppo_v1.training.train:main"
riichi-ppo-smoke = "riichi_ppo_v1.training.train:smoke_main"
riichi-ppo-validate = "riichi_ppo_v1.tools.validate:main"
riichi-sft-prepare = "riichi_ppo_v1.sft.prepare:main"
riichi-sft-train = "riichi_ppo_v1.sft.train:main"
riichi-sft-precompute = "riichi_ppo_v1.sft.precompute:main"

[tool.setuptools]
packages = [
  "riichi_ppo_v1",
  "riichi_ppo_v1.evaluation",
  "riichi_ppo_v1.model",
  "riichi_ppo_v1.training",
  "riichi_ppo_v1.training.rewards",
  "riichi_ppo_v1.sft",
]
package-dir = {riichi_ppo_v1 = "."}

[tool.setuptools.package-data]
riichi_ppo_v1 = ["configs/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
# 规则选择与 RiichiEnv/pyproject.toml 对齐,三包共用同一 lint 基线。
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL", # Pylint
    "UP", # pyupgrade
]
ignore = [
    "B905",    # Zip-without-explicit-strict
    "F403",    # Unable to detect undefined names
    "N812",    # Lowercase imported as non-lowercase
    "N999",    # Invalid module name
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    # 以下为本仓有意的架构选择,显式豁免而非默认关闭:
    "PLC0415", # 函数内延迟导入:torch/riichienv 等重依赖按需加载,测试内隔离导入
    "PLR0911", # Too many return statements:状态分派函数按分支显式返回
    "PLR0915", # Too many statements:训练主循环等长函数,训练期内禁止重构拆分
    "PLR0917", # Too many positional arguments:同 PLR0913,数据管线批量签名
]

[tool.ruff.lint.per-file-ignores]
# grp/prepare 与 learner 主循环内、按 split/minibatch 迭代定义的闭包只在本轮
# 迭代内消费(最后一次 flush 在循环体末尾),且部分变量在 def 之后才赋值,
# 依赖调用时绑定——B023 的晚期绑定在此是承重语义,不做默认参数改写。
"training/grp/prepare.py" = ["B023"]
"training/learner.py" = ["B023"]

