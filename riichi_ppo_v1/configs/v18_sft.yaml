# V18 当前局面 Actor-only SFT 自包含配置（无 overlay/隐式继承）。
seed: 1
device: cuda
learner_gpus: 2
model_size: v18
layers: 4
shared_layers: 3
critic_layers: 2
d_model: 256
query_heads: 16
kv_heads: 4
head_dim: 16
ffn_dim: 704
dense_slot_dim: 32
dense_fusion_dim: 512
context_tokens: 256
rope_base: 10000.0
eps: 0.000001
policy_head_type: current_state_snapshot
dataset: datasets/tenhou_sft_2024_2025_encoded_60pct_v18
epochs: 1
actor_only: true
train_critic: false
train_public_value: false
batch_size: 512
learning_rate: 0.00015
min_learning_rate: 0.00002
warmup_fraction: 0.02
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
max_grad_norm: 1.0
inference_dtype: bf16
length_bucket_window_batches: 32
log_interval_steps: 100
# 关闭逐批全量 Python 语义校验：实测 512 样本/批使 collate 从 9ms 涨到 547ms
# （每步 ~0.8s，CPU 单核打满）。该校验已在 precompute 阶段完成
# （域越界=0、offsets fail-closed、_assert_public_actor），载入端仍有 manifest/
# offsets/_assert_targets_legal 与模型 _assert_structure 兜底；如需重新开启
# 可改回 true（仅调试用，勿用于长跑）。
validate_semantics: false
# torch.compile 可选加速（单卡约 +20%）：DDP 双卡下会因 unused-参数图遍历
# 严重退化（实测 8s/步），请勿在 learner_gpus>=2 时开启。
torch_compile: false
validation_max_samples: 0
validation_samples_per_run: 150000
checkpoint_dir: checkpoints/train_riichi_v18/sft
tensorboard_enabled: true
tensorboard_dirname: tensorboard
resume: null
init_model: null
