# V18 PPO 稳定性训练正式配置:150 updates × 2048 完整半庄。
# 自包含配置,不与 training.yaml 或其他历史配置叠加。
seed: 20260828
device: cuda
learner_gpus: 2
iterations: 150
total_updates: 150
model_size: v18
context_tokens: 256
policy_head_type: current_state_snapshot
critic_layers: 2
inference_dtype: bf16
game_mode: 4p-red-half

# V18 前置产物:SFT 初始化/参考策略与冻结 GRP reward。
init_model: checkpoints/train_riichi_v18/sft/best.pt
grp_checkpoint: checkpoints/train_riichi_v18/grp/best.pt

# Rollout 与推理拓扑。
num_workers: 12
envs_per_worker: 32
env_step_threads: 4
rollout_worker_num_cpus: 2
rollout_worker_cpu_threads: 1
# 推理与 learner 共用同一批 GPU(Ray num_gpus=1 自动分配,固定 2 卡)。
inference_max_batch_size: 512
inference_batch_wait_ms: 16.0
inference_batch_target_rows: 0
inference_batch_target_workers: -1
games_per_update: 2048

# PPO 主超参:Actor 用归一化 advantage,Critic 拟合 old_value + raw GAE。
# 梯度累积=10:每 10 个 minibatch 的(已 DDP 平均)梯度累加后再 step 一次,
# 等效每步有效 batch = 2048×10×2 = 40960。2026-09-02 第二阶段 A 项:编译态
# 下 minibatch 1536→2048(有效 batch 30720→40960,维护者批准边界内唯一超参
# 例外,见第二阶段优化报告第二节;缩放口径 update_wall -20.8%、显存峰值
# allocated 27.9GB≤35GB 验收线)。2026-08-28 第二轮起:actor 上调至 9e-5
# 加快策略前进步长(≈1.5×),critic 上调至 8e-5 跟踪移动目标;shared 维持
# 原值保护公共主干。
gamma: 1.0
gae_lambda: 0.95
ppo_clip: 0.20
update_epochs: 2
minibatch_size: 2048
gradient_accumulation_steps: 10
update_batch_mode: streaming
bucket_window_multiplier: 8
# 训练期跳过前向 GPU 侧结构校验(新增键,B1):输入由 Rust 编码器 fail-closed
# 生成 + SFT 契约校验 + 单测覆盖,校验在训练期是重复检查,且每次 forward 引入
# 十余次 GPU→CPU 同步;关闭不影响数值路径。默认 True(不配置时行为不变)。
update_validate_structure: false

# Tier 2 性能开关(维护者 2026-09-01 批准 △/✗ 级训练期语义变更,默认开启;
# 模型输入语义与 PPO 超参不变。消融对照与数值分布对比见
# audit/reports/v18/report/V18_PPO训练提速优化报告.md):
# - torch_compile(△):learner 前反向编译,浮点归约顺序改变、训练轨迹漂移;
#   置 false 回退 eager(需重启训练生效)。
# - rollout_update_overlap(✗):rollout 与 update 流水线重叠,采样数据滞后
#   一拍(逐轮冻结权重,陈旧度均匀;PPO ratio 逐行自洽);置 false 回退
#   严格串行旧编排。
torch_compile: true
rollout_update_overlap: true

# 第二阶段性能开关(维护者批准边界 2026-09-01 延续,默认开启;消融对照见
# audit/reports/v18/report/V18_PPO训练性能优化第二阶段报告.md):
# - torch_compile_reference(△):冻结 SFT reference 的 policy-only 前向编译
#   (独立 code object,不挤占训练 forward 的 dynamo 缓存);bf16 内核形状级
#   差异,-inf 位逐位一致。置 false 回退 eager reference。
# - learner_shard_transport(★):DDP shard 经 /dev/shm 传递(数组逐位一致,
#   driver 一次写入,learner 零拷贝视图);置 pickle 回退历史 mp.Queue 路径。
torch_compile_reference: true
learner_shard_transport: shm

# critic 侧降温:0.5→0.3,直接压低 critic 分支 pre-clip 梯度,并同步降低
# 回流 shared 公共表示的 value 梯度。
value_coef: 0.3
value_loss: huber
value_target_normalization: batch_std
value_target_std_floor: 0.01

# 三点分段 entropy schedule,loss 使用按合法动作数归一化的 entropy。
entropy_loss_mode: normalized
# 熵项是 actor/shared 梯度的主要常量来源,三项整体下调(0.014/0.006/0.002)
# 以压低梯度底座;不强制熵坍塌,熵曲线顺其自然。
entropy_start: 0.014
entropy_middle: 0.006
entropy_end: 0.002
entropy_middle_fraction: 0.33

# 三分支独立学习率调度,bootstrap 不消耗 policy schedule。
# 2026-08-28 第二轮(从头再训)起:actor 9e-5(原 6e-5,策略前进步长≈1.5×,
# KL/update 目标 1.2-1.5e-3,后续可视效果上调)、critic 8e-5(跟踪 actor
# 提速后移动的 value 目标)、shared 维持 7.5e-6 保护公共主干。
learning_rate: 0.00009
actor_learning_rate: 0.00009
actor_learning_rate_min: 0.0000225
shared_learning_rate: 0.0000075
shared_learning_rate_min: 0.00000375
critic_learning_rate: 0.00008
critic_learning_rate_min: 0.0000225
critic_bootstrap_learning_rate: 0.00002
warmup_fraction: 0.02
# β1 0.95→0.9:配合 accumulation=10 的大有效 batch,一阶动量回到标准响应速度
# (维护者决定:2026-08-27)。
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00001
weight_decay: 0.0

# 稳定性:分支裁剪、critic 公共/私有 embedding 梯度隔离、old-policy KL guardrail。
critic_bootstrap_updates: 2
max_grad_norm: 0.5
actor_max_grad_norm: 0.5
shared_max_grad_norm: 0.5
critic_max_grad_norm: 0.5
critic_public_grad_scale: 0.25
critic_private_embedding_grad_scale: 0.25
target_kl: 0.01
target_kl_check_interval: 8

# SFT reference KL:前段保留中等弱锚,后段不再回锚(0.002→0.0005),
# 避免策略偏离 SFT 后 KL 梯度抬升 actor/shared。
sft_kl_coef_start: 0.0025
sft_kl_coef_middle: 0.001
sft_kl_coef_end: 0.0005
sft_kl_middle_fraction: 0.5

# 每 5 updates 保存 checkpoint 并执行固定 1v3 评测(机制常量见 evaluation/mechanism.py)。
checkpoint_interval_updates: 5
# learner 驱动接收超时:update 时长 ∝ games×epochs,与 minibatch 无关;
# 2048 局全量更新实测外推 ~665-735s,固定 600s 会在 update 3 误杀训练。
update_timeout_s: 1800
eval1v3_interval_updates: 5
checkpoint_dir: checkpoints/train_riichi_v18/ppo
resume: null

opponent_mix:
  enabled: false

eval1v3_enabled: true
eval1v3_model_b: checkpoints/train_riichi_v18/sft/best.pt
# 2026-08-29 维护者决定:评测规模 10 进程 × 600 = 6000 半庄,新种子序列
# (20260829 起,与历史 20260827 序列零重叠),并行 300。机制常量
# DEFAULT_1V3_HANCHANS_PER_PROCESS=400 保持不变,由本配置键覆盖。
eval1v3_hanchans_per_process: 600
eval1v3_seed_base: 20260829
eval1v3_devices: ["0", "1"]
eval1v3_parallel_hanchans: 300
eval1v3_output_dir: audit/reports/v18/eval

progress_update_interval_updates: 10
